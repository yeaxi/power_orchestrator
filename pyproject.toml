[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-orchestrator"
version = "0.5.0"
description = "Safety-first Home Assistant power and load orchestration integration"
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "voluptuous", "PyYAML"]
quality = ["coverage[toml]", "mypy", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components", "mocks"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["mocks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E401", "E402", "F401", "I001"]

[tool.coverage.run]
branch = true
source = ["custom_components/power_orchestrator"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
fail_under = 70
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
