name: Compatibility

# The pinned gates prove the minimum supported Home Assistant version. README
# and hacs.json also claim "2026.7.4 or newer", which nothing else measures.
# This run installs the current Home Assistant release instead of the pin and
# reports on the same behavior suite. It is deliberately kept off pull requests:
# a Home Assistant release must not turn an unrelated PR red, but a silent
# incompatibility should not wait for a user's bug report either.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest_home_assistant:
    name: Latest Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
      - name: Install the current Home Assistant release
        id: install
        run: |
          python -m pip install --upgrade homeassistant pytest-homeassistant-custom-component
          {
            echo "### Installed versions"
            echo '```'
            python -m pip freeze | grep -E '^(homeassistant|pytest-homeassistant-custom-component)=='
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Run the real Home Assistant suite
        run: python -m pytest -c pytest_real_ha.ini tests_real_ha -q
