name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pytest-asyncio voluptuous PyYAML coverage ruff mypy
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests tests_real_ha
      - name: Run Ruff
        run: python -m ruff check custom_components tests tests_real_ha
      - name: Run mypy
        run: python -m mypy custom_components/power_orchestrator
      - name: Validate JSON resources
        run: |
          python -m json.tool custom_components/power_orchestrator/manifest.json >/dev/null
          python -m json.tool custom_components/power_orchestrator/strings.json >/dev/null
          python -m json.tool custom_components/power_orchestrator/translations/en.json >/dev/null
          python -m json.tool custom_components/power_orchestrator/translations/uk.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Validate YAML resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path("custom_components/power_orchestrator/services.yaml"), Path(".github/workflows/ci.yml")):
              yaml.safe_load(path.read_text())
              print(f"YAML OK: {path}")
          PY
      - name: Run tests
        run: python -m coverage run --branch -m pytest tests/ -q
      - name: Coverage report
        run: python -m coverage report

  real_ha:
    name: Real Home Assistant compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install Home Assistant compatibility dependencies
        run: python -m pip install --upgrade homeassistant==2026.7.4 pytest-homeassistant-custom-component==0.13.348
      - name: Run real HA loader smoke test
        run: python -m pytest -c pytest_real_ha.ini tests_real_ha -q
