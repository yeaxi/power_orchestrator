name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run shared local quality gate
        run: python scripts/local_checks.py --suite quality
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-evidence
          path: |
            junit-unit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  real_ha:
    name: Real Home Assistant behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run real Home Assistant suite
        run: python scripts/local_checks.py --suite real-ha
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-ha-evidence
          path: junit-real-ha.xml
          if-no-files-found: warn
          retention-days: 14
