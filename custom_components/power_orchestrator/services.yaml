force_evaluate:
  name: Force evaluate
  description: "Force immediate re-evaluation of load-shedding safety. This does not bypass safety gates or mode policy."
  fields: {}

set_mode:
  name: Set mode
  description: "Persist the controller mode. Auto permits guarded physical shedding and automatic restore of pending loads; Observe evaluates and records intended actions without physical services; Off disables normal shedding. Off and Observe never call physical services, including emergency paths."
  fields:
    mode:
      name: Mode
      description: "Auto may issue guarded physical OFF/ON commands. Observe evaluates and audits only. Off disarms normal policy decisions."
      required: true
      selector:
        select:
          options:
            - "auto"
            - "observe"
            - "off"

request_stop:
  name: Request logical-device stop
  description: "Request a guarded logical-device stop through the integration."
  fields:
    device_id:
      name: Logical device ID
      description: "Stable configured device_id, not a raw entity ID."
      required: true
      selector:
        text: {}
    source:
      name: Request source
      description: "Audit label for the caller."
      required: false
      selector:
        text: {}

clear_quarantine:
  name: Clear device quarantine
  description: "Clear a persisted fault only after verified OFF readback, valid aggregate load, and safe measured power are verified. This never enables a device."
  fields:
    device_id:
      name: Logical device ID
      description: "Stable configured device_id of the quarantined logical device."
      required: true
      selector:
        text: {}
    source:
      name: Clear source
      description: "Audit label for the explicit clear request."
      required: false
      selector:
        text: {}
