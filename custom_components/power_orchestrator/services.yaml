force_evaluate:
  name: Force evaluate
  description: "Force immediate re-evaluation of all loads. This does not bypass safety gates or execution policy."
  fields: {}

set_mode:
  name: Set planner mode
  description: "Arm or disarm normal policy evaluation. Off blocks normal starts; emergency safety stops remain active."
  fields:
    mode:
      name: Planner mode
      description: "Auto arms normal policy evaluation; off keeps normal planner actions disarmed. This is separate from observe/live physical execution policy."
      required: true
      selector:
        select:
          options:
            - "auto"
            - "off"

request_start:
  name: Request logical-device start
  description: "Request a guarded start through Power Orchestrator. The integration validates telemetry, ownership, reserve, and readback before any physical command."
  fields:
    device_id:
      name: Logical device ID
      description: "Stable configured device_id, not a raw switch entity ID."
      required: true
      selector:
        text: {}
    source:
      name: Request source
      description: "Audit label for the caller, such as dashboard, automation, or user."
      required: false
      selector:
        text: {}

request_stop:
  name: Request logical-device stop
  description: "Request a guarded logical-device stop through the integration; do not call a physical relay service directly."
  fields:
    device_id:
      name: Logical device ID
      description: "Stable configured device_id, not a raw switch entity ID."
      required: true
      selector:
        text: {}
    source:
      name: Request source
      description: "Audit label for the caller."
      required: false
      selector:
        text: {}

clear_quarantine:
  name: Clear device quarantine
  description: "Clear a persisted fault/recovery quarantine only after the integration verifies fresh device OFF readback, valid aggregate load, and safe measured power. This never turns a device on."
  fields:
    device_id:
      name: Logical device ID
      description: "Stable configured device_id of the quarantined logical device; raw physical relay entity IDs are not accepted."
      required: true
      selector:
        text: {}
    source:
      name: Clear source
      description: "Audit label for the explicit clear request, such as dashboard or operator."
      required: false
      selector:
        text: {}

set_execution_mode:
  name: Set physical execution policy
  description: "Select observe or live execution. Observe never emits normal physical commands; live requires explicit confirmation."
  fields:
    execution_mode:
      name: Execution policy
      description: "Observe performs decisions and audit only; live permits guarded normal commands after all safety checks."
      required: true
      selector:
        select:
          options:
            - "observe"
            - "live"
    confirm_live:
      name: Confirm live ownership
      description: "Must be true to enter live execution. Existing transitional automations must remain coordinated and rollback evidence must be ready."
      required: false
      selector:
        boolean: {}
