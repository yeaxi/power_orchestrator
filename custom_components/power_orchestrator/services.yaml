force_evaluate:
  name: Force evaluate
  description: "Force immediate re-evaluation of load-shedding safety. This does not bypass safety gates or execution policy."
  fields: {}

set_mode:
  name: Set automation mode
  description: "Persistently arm or disarm normal load-shedding. Auto executes guarded stop-only shedding at overload; off disables normal shedding while emergency safety stops remain active."
  fields:
    mode:
      name: Automation mode
      description: "Auto evaluates overload and may issue guarded physical OFF commands; off disarms normal policy decisions. This setting survives Home Assistant restart."
      required: true
      selector:
        select:
          options:
            - "auto"
            - "off"

request_stop:
  name: Request logical-device stop
  description: "Request a guarded logical-device stop through the integration; the integration never enables a load."
  fields:
    device_id:
      name: Logical device ID
      description: "Stable configured device_id, not a raw entity ID."
      required: true
      selector:
        text: {}
    source:
      name: Request source
      description: "Audit label for the caller."
      required: false
      selector:
        text: {}

clear_quarantine:
  name: Clear device quarantine
  description: "Clear a persisted fault only after verified OFF readback, valid aggregate load, and safe measured power are verified. This never enables a device."
  fields:
    device_id:
      name: Logical device ID
      description: "Stable configured device_id of the quarantined logical device."
      required: true
      selector:
        text: {}
    source:
      name: Clear source
      description: "Audit label for the explicit clear request."
      required: false
      selector:
        text: {}

set_execution_mode:
  name: Set physical execution policy
  description: "Select observe or live execution. Observe never emits physical commands; live permits guarded load-shedding stops after explicit confirmation."
  fields:
    execution_mode:
      name: Execution policy
      description: "Observe performs decisions and audit only; live permits guarded stop commands."
      required: true
      selector:
        select:
          options:
            - "observe"
            - "live"
    confirm_live:
      name: Confirm live ownership
      description: "Must be true to enter live execution."
      required: false
      selector:
        boolean: {}

authorize_shedding:
  name: Authorize exact shedding loads
  description: "In observe mode, explicitly claim only listed already-on loads for a later live stop-only test. This never calls a physical service."
  fields:
    device_ids:
      name: Logical device IDs
      description: "Exact configured stable device_id values. No wildcard or omitted device is implied."
      required: true
      selector:
        object: {}
    confirm_takeover:
      name: Confirm ownership takeover
      description: "Must be true to change the listed currently-on loads from external to planner ownership."
      required: true
      selector:
        boolean: {}
