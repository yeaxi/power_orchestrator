rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not register Home Assistant conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-installation-parameters: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not register Home Assistant triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: This integration orchestrates existing Home Assistant entities and has no remote connection to test.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The integration stores no credentials and has no authenticated remote service.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: The integration discovers optional load and safety metadata only; managed entities remain explicitly selected by the user.
  discovery-update-info:
    status: exempt
    comment: The integration has no network discovery and does not own remote device addresses.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Managed logical devices are configured as stable entity mappings in one singleton entry; changes use reconfiguration.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: The integration does not create a remote device fleet; its entities represent one local orchestration service.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests and declares no HTTP client dependency.
  strict-typing: done
